{% extends "base.html" %}

{% block title %}Forgot Password - A.C.E{% endblock %}

{% block content %}
    <h2>Reset Password Request</h2>
    <p>Please enter your registered college email address. A password reset request will be submitted to the system administrator.</p>

    <form method="POST">
        <div class="form-group">
            <label for="email">Registered Email Address:</label>
            <input type="email" id="email" name="email" required placeholder="e.g. yourname@college.com">
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <button type="submit" class="btn">Submit Request</button>
            <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Back to Login</a>
        </div>
    </form>
{% endblock %}
