{% extends "base.html" %}

{% block title %}My Profile - A.C.E{% endblock %}

{% block content %}
    <h2>My Student Profile</h2>
    <p>Update your personal contact information.</p>

    <form method="POST">
        <div class="form-group">
            <label for="roll_no">Roll Number:</label>
            <input type="text" id="roll_no" value="{{ student.roll_no }}" disabled style="background-color: #eeeeee;">
        </div>

        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" value="{{ student.name }}" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" value="{{ student.email or '' }}">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" value="{{ student.phone or '' }}" placeholder="e.g. 9876543210" maxlength="15">
        </div>

        <div class="form-group">
            <label>Branch & Semester:</label>
            <input type="text" value="{{ student.branch }} - Semester {{ student.semester }} (Section {{ student.section }})" disabled style="background-color: #eeeeee;">
        </div>

        <div class="form-group">
            <label>Faculty Mentor:</label>
            <input type="text" value="{{ student.mentor.name if student.mentor else 'Not assigned' }}" disabled style="background-color: #eeeeee;">
        </div>

        <div style="margin-top: 15px;">
            <button type="submit" class="btn">Update Profile</button>
            <a href="{{ url_for('dashboard.student_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
